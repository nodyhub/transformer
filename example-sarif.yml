# Example: Security Scanning Pipeline with SARIF Output
# This example shows how to run multiple security tools and merge their SARIF reports

steps:
  # Run Trivy vulnerability scan on a container image
  - id: trivy_scan
    name: Trivy Container Scan
    uses: builtin/tools/trivy
    with:
      type: image
      target: nginx:latest
      format: json
  
  # Convert Trivy output to SARIF
  - id: trivy_sarif
    name: Convert Trivy to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "trivy"
      input: ${{ outputs.trivy_scan }}
  
  # Run Semgrep static analysis on source code
  - id: semgrep_scan
    name: Semgrep Code Scan
    uses: builtin/tools/semgrep
    with:
      target: .
      config: auto
      format: json
  
  # Convert Semgrep output to SARIF
  - id: semgrep_sarif
    name: Convert Semgrep to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "semgrep"
      input: ${{ outputs.semgrep_scan }}
  
  # Run Nuclei security scan
  - id: nuclei_scan
    name: Nuclei Security Scan
    uses: builtin/tools/nuclei
    with:
      target: https://example.com
      format: json
  
  # Convert Nuclei output to SARIF
  - id: nuclei_sarif
    name: Convert Nuclei to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "nuclei"
      input: ${{ outputs.nuclei_scan }}
  
  # Run Trufflehog to detect secrets in the repository
  - id: trufflehog_scan
    name: Trufflehog Secret Detection
    uses: builtin/tools/trufflehog
    with:
      type: filesystem
      target: .
      json: true
  
  # Convert Trufflehog output to SARIF
  - id: trufflehog_sarif
    name: Convert Trufflehog to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "trufflehog"
      input: ${{ outputs.trufflehog_scan }}
  
  # Run Nmap to scan network ports
  - id: nmap_scan
    name: Nmap Port Scan
    uses: builtin/tools/nmap
    with:
      target: localhost
      version-detection: true
      format: json
  
  # Convert Nmap output to SARIF
  - id: nmap_sarif
    name: Convert Nmap to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "nmap"
      input: ${{ outputs.nmap_scan }}
  
  # Run Gosec to scan Go code for security issues
  - id: gosec_scan
    name: Gosec Security Scan
    uses: builtin/tools/gosec
    with:
      target: ./...
      format: json
  
  # Convert Gosec output to SARIF
  - id: gosec_sarif
    name: Convert Gosec to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "gosec"
      input: ${{ outputs.gosec_scan }}

  # Run OSV-Scanner to check for vulnerabilities
  - id: osv_scan
    name: OSV Scanner Vulnerability Scan
    uses: builtin/tools/osv-scanner
    with:
      target: go.mod
      format: json

  # Convert OSV output to SARIF
  - id: osv_sarif
    name: Convert OSV to SARIF
    uses: builtin/sarif/convert
    with:
      tool: "osv"
      input: ${{ outputs.osv_scan }}

  # Merge all SARIF reports into a unified report
  - id: unified_report
    name: Merge SARIF Reports
    uses: builtin/sarif/merge
    with:
      reports:
        - ${{ outputs.trivy_sarif }}
        - ${{ outputs.semgrep_sarif }}
        - ${{ outputs.nuclei_sarif }}
        - ${{ outputs.trufflehog_sarif }}
        - ${{ outputs.nmap_sarif }}
        - ${{ outputs.gosec_sarif }}
        - ${{ outputs.osv_sarif }}

  # Suppress known false positives
  - id: suppressed_report
    name: Suppress Findings
    uses: builtin/sarif/suppress
    with:
      input: ${{ outputs.unified_report }}
      path_patterns:
        - "vendor/**"
        - "test/**"
      severities:
        - note

  # Save the unified report to a file
  - id: save_report
    name: Save Unified SARIF Report
    uses: builtin/file/write
    with:
      path: "security-report.sarif"
      content: ${{ outputs.suppressed_report }}
  
  # Print success message
  - name: Print Summary
    uses: builtin/echo
    with:
      message: "✓ Unified SARIF report saved to security-report.sarif"

