# Echo Builtin Examples

# Basic string
- name: Simple message
  uses: builtin/echo
  with:
    message: Hello World

# With output capture
- id: greeting
  name: Captured output
  uses: builtin/echo
  with:
    message: Hello, Transformer!

# Using CLI arguments
- name: Print first argument
  uses: builtin/echo
  with:
    message: First arg is ${{ args.0 }}

- name: Print all arguments
  uses: builtin/echo
  with:
    message: ${{ args }}

- name: Greet user
  uses: builtin/echo
  with:
    message: Hello ${{ args.0 }}!

# Using environment variables
- name: Print HOME
  uses: builtin/echo
  with:
    message: ${{ env.HOME }}

- name: Show user info
  uses: builtin/echo
  with:
    message: User ${{ env.USER }} home is ${{ env.HOME }}

# Using step outputs
- id: date_output
  uses: builtin/shell
  with:
    command: date

- name: Print previous output
  uses: builtin/echo
  with:
    message: Current date is ${{ outputs.date_output }}

- name: Reference greeting
  uses: builtin/echo
  with:
    message: Earlier we said "${{ outputs.greeting }}"

# Multiline content
- name: Multiline message
  uses: builtin/echo
  with:
    message: |
      Line 1
      Line 2
      Line 3

# List of strings
- name: Print multiple lines
  uses: builtin/echo
  with:
    message:
      - First line
      - Second line
      - Third line
