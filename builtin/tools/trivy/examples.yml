# Scan container image
- name: Scan production image
  uses: builtin/tools/trivy
  with:
    type: image
    target: myregistry.io/myapp:v1.0.0
    format: sarif
    output: trivy.sarif
    severity: HIGH,CRITICAL
    exit-code: 1

# Scan filesystem
- name: Scan source code
  uses: builtin/tools/trivy
  with:
    type: fs
    target: /workspace
    format: json
    output: trivy-fs.json
    scanners: vuln,secret,misconfig

# Scan Git repository
- name: Scan remote repository
  uses: builtin/tools/trivy
  with:
    type: repo
    target: https://github.com/user/repo
    format: table
    severity: CRITICAL

# Advanced scan with custom config
- name: Advanced Trivy scan
  uses: builtin/tools/trivy
  with:
    type: image
    target: nginx:latest
    format: sarif
    output: trivy.sarif
    ignore-unfixed: true
    additional-args:
      - --timeout
      - 10m
      - --skip-dirs
      - /tmp
