# Shell Builtin Examples

# Basic command
- name: Simple command
  uses: builtin/shell
  with:
    command: echo "Hello World"

# With output capture
- id: get_date
  name: Capture date output
  uses: builtin/shell
  with:
    command: date

# Multiline script
- name: Multiple commands
  uses: builtin/shell
  with:
    command: |
      echo "Starting..."
      pwd
      echo "Done"

# Using CLI arguments
- name: Echo first argument
  uses: builtin/shell
  with:
    command: |
      echo "First arg is ${{ args.0 }}"

- name: Echo all arguments
  uses: builtin/shell
  with:
    command: |
      echo "All args: ${{ args }}"

# Using environment variables
- name: Show PATH
  uses: builtin/shell
  with:
    command: echo "PATH=${{ env.PATH }}"

- name: Show user and home
  uses: builtin/shell
  with:
    command: echo "User ${{ env.USER }} at ${{ env.HOME }}"

# Using step outputs
- id: hostname
  uses: builtin/shell
  with:
    command: hostname

- name: Use previous output
  uses: builtin/shell
  with:
    command: echo "Running on ${{ outputs.hostname }} at ${{ outputs.get_date }}"

# Output redirection - Show in terminal
- name: Visible in terminal
  uses: builtin/shell
  with:
    command: |
      echo "This appears in terminal"
    stdout: stdout

- name: Errors visible in terminal
  uses: builtin/shell
  with:
    command: echo "Error message" >&2
    stderr: stderr

# Output redirection - Merge stderr to stdout
- name: Merge streams
  uses: builtin/shell
  with:
    command: |
      echo "Normal output"
      echo "Error output" >&2
    stderr: stdout

# Output redirection - Discard output
- name: Silent execution
  uses: builtin/shell
  with:
    command: echo "This is suppressed"
    stdout: discard

- name: Suppress errors
  uses: builtin/shell
  with:
    command: echo "Error" >&2
    stderr: discard

# Output redirection - Write to files
- name: Log to file
  uses: builtin/shell
  with:
    command: echo "Logged at $(date)"
    stdout: /tmp/transformer_output.log

- name: Separate logs
  uses: builtin/shell
  with:
    command: |
      echo "Normal output"
      echo "Error output" >&2
    stdout: /tmp/stdout.log
    stderr: /tmp/stderr.log

# Complex example combining everything
- id: complex
  name: Complex command with substitutions
  uses: builtin/shell
  with:
    command: |
      echo "=== System Info ==="
      echo "Hostname: ${{ outputs.hostname }}"
      echo "Date: ${{ outputs.get_date }}"
      echo "User: ${{ env.USER }}"
      echo "Arg: ${{ args.0 }}"
      echo "==================="
    stdout: stdout
