name: Security Scan
on: [pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run make image 
        run: |
          make image
      
      - name: Run security scan
        uses: nodyhub/transformer@v0.0.1
        with:
          scan-file: '.github/transformer/scan.yml'
          fail-on-error: 'true'
